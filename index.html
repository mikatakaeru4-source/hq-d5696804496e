<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競技クイズ早押し</title>
<link rel="icon" href="data:,">
<style>
:root { --bg:#fafafa; --fg:#1d2430; --muted:#667085; --card:#fff; --line:#d0d5dd; --accent:#2457d6; --ok:#117a3d; --err:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#12161c; --fg:#e6e9ee; --muted:#98a2b3; --card:#1b212a; --line:#333c49; --accent:#6f95ff; --ok:#4cc17f; --err:#ff8a80; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Yu Gothic UI", sans-serif; }
nav { display:flex; position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); z-index:5; }
nav a { flex:1; text-align:center; padding:14px 8px; min-height:48px; color:var(--fg); text-decoration:none; }
nav a.on { border-bottom:3px solid var(--accent); font-weight:700; }
main { max-width:900px; margin:0 auto; padding:16px; }
h1 { font-size:1.3rem; margin:.2em 0 .6em; }
.filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px; }
input, select, textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; min-height:44px; max-width:100%; }
textarea { width:100%; min-height:90px; }
button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
button.sec { background:var(--card); color:var(--fg); border-color:var(--line); }
button.danger { background:var(--err); border-color:var(--err); }
label.f { display:block; margin:10px 0; font-size:.9rem; color:var(--muted); }
label.f > input, label.f > select, label.f > textarea { display:block; width:100%; color:var(--fg); margin-top:4px; }
label.chk { display:flex; align-items:center; gap:6px; }
label.chk input { min-height:0; width:auto; }
.item { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; color:inherit; text-decoration:none; }
.item .meta { color:var(--muted); font-size:.82rem; }
.pager { display:flex; gap:8px; align-items:center; justify-content:space-between; margin:12px 0; }
.status { min-height:1.6em; font-weight:600; }
.status.ok { color:var(--ok); } .status.err { color:var(--err); }
.errlist { color:var(--err); margin:8px 0; padding-left:1.2em; }
fieldset { border:1px solid var(--line); border-radius:10px; margin:16px 0; padding:8px 14px; background:var(--card); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.stars button { padding:4px 10px; min-height:44px; background:var(--card); color:var(--fg); border-color:var(--line); }
.stars button.on { background:var(--accent); color:#fff; }

.banner { background:#fff4ce; color:#5c4400; border:1px solid #e0c36a; border-radius:8px; padding:8px 12px; margin:8px 0; }
.banner.err { background:#fde8e6; color:var(--err); border-color:var(--err); }
.qbody { font-size:1.25rem; line-height:1.9; min-height:5em; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; }
.buzz { flex:1; min-height:64px; font-size:1.2rem; font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
.choices { display:grid; gap:8px; margin:12px 0; }
.choice { text-align:left; background:var(--card); color:var(--fg); border-color:var(--line); min-height:52px; }
.choice.ok { background:var(--ok); color:#fff; border-color:var(--ok); opacity:1; }
.choice.bad { background:var(--err); color:#fff; border-color:var(--err); opacity:.8; }
.result { border-top:2px solid var(--line); margin-top:12px; padding-top:8px; }
.verdict { font-size:1.4rem; font-weight:800; } .verdict.ok { color:var(--ok); } .verdict.bad { color:var(--err); }

.roomcode { font-size:3.2rem; font-weight:800; letter-spacing:.3em; text-align:center; background:var(--card); border:2px dashed var(--accent); border-radius:12px; padding:8px 0 8px .3em; margin:8px 0; }
.lives { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin:4px 0 8px; }
.life .lname { font-size:.85rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.life.me .lname { color:var(--accent); }
.life.off { opacity:.55; }
.life .bar { height:16px; border-radius:8px; background:var(--line); overflow:hidden; }
.life .bar i { display:block; height:100%; background:var(--ok); transition:width .6s ease; }
.life .lnum { font-weight:800; font-size:1.3rem; line-height:1.2; }
.life.hit { animation:hit .5s; }
@keyframes hit { 20% { transform:translateX(-6px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(3px); } }
.vs { font-weight:800; color:var(--muted); }
.bigbuzz { width:100%; min-height:96px; font-size:1.5rem; touch-action:manipulation; user-select:none; -webkit-user-select:none; background:#d92d20; border-color:#d92d20; color:#fff; }
.bigbuzz.wait { opacity:.6; }
.finish { font-size:1.8rem; font-weight:800; text-align:center; margin:10px 0; }
.finish.ok { color:var(--ok); } .finish.bad { color:var(--err); }
@media (prefers-reduced-motion: reduce) { .life.hit { animation:none; } .life .bar i { transition:none; } }
.duelbtns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.duelbtns .bigbuzz small { display:block; font-size:.8rem; opacity:.85; }
.duelbtns .bigbuzz.p1 { background:#1d6fd9; border-color:#1d6fd9; }
body.remote nav a:not([data-r=play]):not([data-r=duel]):not([data-r=battle]):not([data-r=link]) { display:none; }
body.offline nav a[data-r=battle], body:not(.offline) nav a[data-r=link] { display:none; }
.duelbtns.one { grid-template-columns:1fr; }
.qr { display:block; margin:8px auto; width:min(94vw,560px); height:auto; image-rendering:pixelated; background:#fff; padding:8px; border-radius:8px; }
textarea.code { width:100%; min-height:5em; font:12px/1.3 monospace; word-break:break-all; }
video.scan { width:100%; max-height:50vh; background:#000; border-radius:8px; }

</style>

// Punctuation delays the chars that follow it (pause is scaled by 1/rate).
